apiVersion: v1
kind: Namespace
metadata:
  name: asr-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-config
  namespace: asr-prod
data:
  environment: "prod"
  slots: "16"
  service_ms: "300"
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-asr
  namespace: asr-prod
  labels: { app: whisper-asr }
spec:
  selector: { app: whisper-asr }
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-asr
  namespace: asr-prod
  labels: { app: whisper-asr }
spec:
  replicas: 2
  selector:
    matchLabels: { app: whisper-asr }
  template:
    metadata:
      labels: { app: whisper-asr }
    spec:
      containers:
        - name: stub
          image: python:3.12-slim
          command: ["python", "/src/stub_asr_server.py"]
          args: ["--port=8000", "--slots=16", "--service-ms=300", "--load-seconds=2"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 2
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 96Mi }
          volumeMounts:
            - name: src
              mountPath: /src
      volumes:
        - name: src
          configMap: { name: stub-src }
